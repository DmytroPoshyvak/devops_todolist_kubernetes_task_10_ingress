apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: todoapp
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  rules:
    - http:
        paths:
          - pathType: ImplementationSpecific
            path: /(.*)
            backend:
              service:
                name: todoapp-service
                port:
                  number: 80
